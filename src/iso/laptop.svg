<svg xmlns="http://www.w3.org/2000/svg" viewBox="-77.962 -114 161.12 180"
     class="iso iso--laptop" role="img" aria-hidden="true" focusable="false">
  <title>Laptop</title>
  <defs>
    <filter id="fw-contact" x="-60%" y="-140%" width="220%" height="380%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <clipPath id="fw-clip-laptop">
      <polygon points="-6.928,-35 51.962,-1 6.928,25 -51.962,-9"/>
      <polygon points="-6.928,-35 51.962,-1 51.962,-51 -6.928,-85"/>
      <polygon points="-1.732,-88 57.158,-54 51.962,-51 -6.928,-85"/>
      <polygon points="-51.962,-4 6.928,30 6.928,25 -51.962,-9"/>
      <polygon points="57.158,-4 51.962,-1 51.962,-51 57.158,-54"/>
      <polygon points="51.962,4 6.928,30 6.928,25 51.962,-1"/>
    </clipPath>
  </defs>

  <ellipse cx="2.598"
             cy="-1.5"
             rx="61.56"
             ry="35.5"
             fill="var(--ink)" opacity="0.09" filter="url(#fw-contact)"/>

  <g class="iso__body">
      <polygon points="-6.928,-35 51.962,-1 6.928,25 -51.962,-9" fill="var(--blush-light)" stroke="var(--blush-light)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <polygon points="-6.928,-35 51.962,-1 51.962,-51 -6.928,-85" fill="var(--blush)" stroke="var(--blush)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <polygon points="-1.732,-88 57.158,-54 51.962,-51 -6.928,-85" fill="var(--blush-light)" stroke="var(--blush-light)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <polygon points="-51.962,-4 6.928,30 6.928,25 -51.962,-9" fill="var(--blush)" stroke="var(--blush)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <polygon points="57.158,-4 51.962,-1 51.962,-51 57.158,-54" fill="var(--blush-shadow)" stroke="var(--blush-shadow)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <polygon points="51.962,4 6.928,30 6.928,25 51.962,-1" fill="var(--blush-shadow)" stroke="var(--blush-shadow)"
             stroke-width="10" stroke-linejoin="round" paint-order="stroke fill"/>
      <line x1="-6.928" y1="-35"
              x2="-51.962" y2="-9"
              stroke="var(--blush-hi)" stroke-width="1.5"
              stroke-linecap="round" opacity="0.55"/>
      <line x1="-1.732" y1="-88"
              x2="-6.928" y2="-85"
              stroke="var(--blush-hi)" stroke-width="1.5"
              stroke-linecap="round" opacity="0.55"/>
      
      
  </g>

  <!-- Grain, clipped to the silhouette. Same tile as the headlines: that is
       what makes the type and the objects one material.

       Root-relative on purpose. These icons are INLINED into a host page
       (see the note at the top of the file), so a path relative to this file
       would resolve against the page instead and 404. Every site serves the
       tile at /tex/. -->
  <g clip-path="url(#fw-clip-laptop)" style="mix-blend-mode:overlay" opacity="0.07">
    <image href="/tex/felt-1024.png" x="-77.962" y="-114"
           width="161.12" height="180"
           preserveAspectRatio="xMidYMid slice"/>
  </g>
</svg>
